name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js www/
          cp *.png www/ 2>/dev/null || true

      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/android @capacitor/cli

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets
        run: npx cap copy android

      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk mafort-heavy.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: mafort-heavy.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
